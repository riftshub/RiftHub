name: Unzip and build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$Z" ]; then
            unzip -oq "$Z" -d /tmp/z
            D=$(dirname "$(find /tmp/z -maxdepth 3 -name package.json | head -n1)")
            rm -rf "$D/.github"
            cp -r "$D"/. .
            git rm -q "$Z"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add -A
            git commit -m "Unzip game files"
            git push
          fi
      - uses: actions/setup-node@v4
        if: hashFiles('www/index.html') != ''
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        if: hashFiles('www/index.html') != ''
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        if: hashFiles('www/index.html') != ''
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.backrooms.coop","appName":"Backrooms Co-op","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          [ -d android ] || npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape" android:keepScreenOn="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item>#g' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Build APK
        if: hashFiles('www/index.html') != ''
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('www/index.html') != ''
        with:
          name: backrooms-coop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
