name: Compile Minecraft Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build_game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically Extract Client ZIP
        run: |
          unzip -o client.zip -d client_extracted
          if [ -d "client_extracted/client" ]; then
            mv client_extracted/client ./client
          else
            mv client_extracted ./client
          fi
          rm client.zip

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'client/pnpm-lock.yaml'

      - name: Install Project Dependencies (via pnpm)
        working-directory: ./client
        run: pnpm install --no-frozen-lockfile

      - name: Force-Install Missing Mineflayer Plugin
        working-directory: ./client
        run: pnpm add @nxg-org/mineflayer-util-plugin -D

      - name: Install Missing TS Execution Packages
        working-directory: ./client
        run: pnpm add -g tsx

      - name: Generate Optimized Minecraft Texture Data
        working-directory: ./client
        run: pnpm prepare-project

      - name: Inject Clean Render URL into Public Config Directory
        run: |
          mkdir -p client/public
          cat << 'EOF' > client/public/config.json
          {
            "version": 1,
            "defaultHost": "localhost",
            "defaultProxy": "https://gl-ujm9.onrender.com",
            "mapsProvider": "https://mcraft.fun",
            "skinTexturesProxy": "",
            "p2pRelayServer": "wss://p2p.mcraft.fun",
            "promoteServers": [
              {
                "ip": "://gl-ujm9.onrender.com",
                "name": "True Element",
                "description": "Cars & guns multiplayer world",
                "version": "1.18"
              }
            ],
            "rightSideText": "A Minecraft client clone in the browser!",
            "splashText": "Mind the bugs and have fun!",
            "splashTextFallback": "Welcome!",
            "pauseLinks": [[{"type": "github"},{"type": "discord"}]],
            "defaultUsername": "mcrafter{0-9999}",
            "mobileButtons": [
              {"action": "general.selectItem","actionHold": "","label": "S"},
              {"action": "general.debugOverlay","actionHold": "general.debugOverlayHelpMenu","label": "F3"},
              {"action": "general.playersList","actionHold": "","icon": "pixelarticons:users","label": "TAB"},
              {"action": "general.chat","actionHold": "","label": ""},
              {"action": "ui.pauseMenu","actionHold": "","label": ""}
            ],
            "allowAutoConnect": true,
            "multiplayerRoom": true
          }
          EOF

      - name: Run Clean Build (With Real Config Parameters)
        working-directory: ./client
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NODE_ENV: production
        run: |
          pnpm dlx update-browserslist-db@latest --yes
          pnpm run build

      - name: Package Complete Dist Folder
        uses: actions/upload-artifact@v4
        with:
          name: finished-porkbun-game
          path: client/dist/
          
