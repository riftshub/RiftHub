name: Compile Minecraft Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build_game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically Extract Client ZIP
        run: |
          unzip -o client.zip -d client_extracted
          if [ -d "client_extracted/client" ]; then
            mv client_extracted/client ./client
          else
            mv client_extracted ./client
          fi
          rm client.zip

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'client/pnpm-lock.yaml'

      - name: Install Project Dependencies (via pnpm)
        working-directory: ./client
        run: pnpm install --no-frozen-lockfile

      - name: Run Clean Build
        working-directory: ./client
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NODE_ENV: production
        run: |
          pnpm dlx update-browserslist-db@latest --yes
          pnpm run build

      - name: Manual Force-Sync Missing Asset Folders
        run: |
          # Automatically detects and copies missing asset folders directly into your final web build
          [ -d "client/public" ] && cp -r client/public/* client/dist/ || true
          [ -d "client/assets" ] && cp -r client/assets client/dist/ || true
          [ -d "client/textures" ] && cp -r client/textures client/dist/ || true

      - name: Package Complete Dist Folder
        uses: actions/upload-artifact@v4
        with:
          name: finished-porkbun-game
          path: client/dist/
