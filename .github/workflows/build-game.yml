name: Unzip and build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$Z" ]; then
            unzip -oq "$Z" -d /tmp/z
            D=$(dirname "$(find /tmp/z -maxdepth 3 -name package.json | head -n1)")
            rm -rf "$D/.github"
            cp -r "$D"/. .
            git rm -q "$Z"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add -A
            git commit -m "Unzip game files"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: bash tools/android-setup.sh
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-coop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
